version: '3.8'

services:
  api:
    build: .
    container_name: grid-motors-api
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/grid_motors
      JWT_SECRET: ${JWT_SECRET:-supersecretkey}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run db:migrate && npm start"

  db:
    image: postgres:16-alpine
    container_name: grid-motors-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grid_motors
    ports:
      - '5432:5432'
    volumes:
      - grid_motors_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grid_motors_data:
